server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;  # photo uploads on the review page

  location = / { return 302 /prj1/; }
  location /prj1/ { try_files $uri $uri/ /prj1/index.html; }  # vue-router history mode

  # same routes the Vite dev proxy has (vite.config.js)
  location /api/ {
    proxy_pass http://backend:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;  # ingest runs YOLO + SigLIP on CPU
  }
  location /images/ { proxy_pass http://backend:8001; }
}
