server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;  # photo uploads on the review page
  absolute_redirect off;  # keep redirects relative: nginx listens on 80 inside, the host sees 8080

  location = / { return 302 /prj1/; }
  location /prj1/ { try_files $uri $uri/ /prj1/index.html; }  # vue-router history mode
  # search engines (change topic-guard-sitemap-item-services): the sitemap is built by the backend on every read;
  # crawlers read robots.txt only from the host root
  location = /prj1/sitemap.xml { proxy_pass http://backend:8001/sitemap.xml; proxy_set_header Host $host; }
  location = /robots.txt { alias /usr/share/nginx/html/prj1/robots.txt; }

  # same routes the Vite dev proxy has (vite.config.js)
  location /api/ {
    proxy_pass http://backend:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;  # ingest runs YOLO + SigLIP on CPU
  }
  location /images/ { proxy_pass http://backend:8001; }
}
